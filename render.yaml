# Render Blueprint: one free web service (API + web app). Database lives outside Render (see README).
services:
  - type: web
    name: promise-keeper
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # paste your Postgres connection string in the Render dashboard
